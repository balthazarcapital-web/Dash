<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de locações</title><link rel="stylesheet" href="styles.css?v=1.2.0"></head><body><main class="main" style="margin-left:0"><header class="topbar"><div class="page-heading"><p>GESTÃO DE OBRAS</p><h1>Controle de locações</h1></div><a class="button button-secondary" href="index.html">← Voltar ao painel</a></header><div class="content rentals-view"><header class="work-hero"><div><p class="eyebrow">CONTROLE OPERACIONAL</p><h2>Todos os pedidos de locação</h2><p>Acompanhe envio, troca, vencimento e devolução dos equipamentos.</p></div><button class="button button-primary" id="rental-new">+ Nova locação</button></header><div class="rental-kpis"><article><span>ATIVAS</span><strong id="rental-active-count">0</strong></article><article><span>VENCENDO EM 7 DIAS</span><strong id="rental-due-count">0</strong></article><article><span>DEVOLUÇÕES PENDENTES</span><strong id="rental-return-count">0</strong></article></div><section class="panel rental-form" id="rental-form" hidden><div class="form-grid"><label class="field-label">Material/equipamento<input id="rental-item"></label><label class="field-label">Fornecedor<input id="rental-supplier"></label><label class="field-label">Data de envio<input id="rental-sent" type="date"></label><label class="field-label">Vencimento<input id="rental-due" type="date"></label><label class="field-label">Próxima troca<input id="rental-exchange" type="date"></label><label class="field-label">Valor mensal<input id="rental-value" type="number" step="0.01"></label></div><div class="step-actions"><button class="button button-secondary" id="rental-cancel">Cancelar</button><button class="button button-primary" id="rental-save">Salvar locação</button></div></section><section class="panel"><div class="panel-header"><h3>Locações da obra</h3><span class="panel-total" id="rental-summary">0 registros</span></div><div class=
