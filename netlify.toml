[build]
  command = "mkdir -p public/comparativo-cli-inova public/erp-compras && cp index.html locacoes.html locacoes.js styles.css data.js quotes.js works.js app.js web-demo.js works-data.json _headers public/ && cp comparativo-cli-inova/index.html public/comparativo-cli-inova/ && cp erp-compras/index.html public/erp-compras/"
  publish = "public"

[functions]
  directory = "api"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
